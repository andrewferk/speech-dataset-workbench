[project]
name = "sdw"
# `version` lives once in `src/sdw/__init__.py` and is derived here at build time (#37). It is a
# `dataset_version` hash input, so it must read the source tree, not the install (ADR-0010); deriving
# rather than duplicating means `importlib.metadata.version("sdw")` still answers correctly.
dynamic = ["version"]
description = "Speech Dataset Workbench — a local-first CLI that turns prompted speech recordings into a validated, reproducible, versioned dataset."
requires-python = ">=3.13"
dependencies = [
    "soundfile",
    "soxr", # python-soxr; `soxr` is its distribution name on PyPI
    "numpy",
    "scipy",
    "matplotlib",
    # The vendored Tier B normalizer's two imports. Base, not behind the `asr` extra: Scoring runs
    # in a venv that has no extra installed (ADR-0018, ADR-0023).
    "regex",
    "more-itertools",
]

# Floors, no caps and no `==` pins: an `==` would claim a reproducibility ADR-0016 disclaims, and
# `run.json` already records the resolved versions per Run (ADR-0020, ADR-0023).
[project.optional-dependencies]
asr = ["transformers>=5", "torch>=2.13"]

# `uv sync` installs the package (editable) into `.venv`, so nothing needs `src/` on the path
# (ADR-0014, amending ADR-0012). `python -m sdw` keeps working alongside this.
[project.scripts]
sdw = "sdw.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/sdw/__init__.py"

# A group, not an extra, while `asr` above is an extra, not a group — the asymmetry is the decision
# (ADR-0023). Groups are absent from published metadata, so `dev` can never be installed by a
# consumer of `sdw` and `pip install 'sdw[asr]'` could not work if `asr` were one.
[dependency-groups]
dev = [
    "ruff==0.14.4",
    "mypy==1.19.0",
    "pytest==9.0.1",
    "pytest-cov==7.0.0",
]

# Linux resolves torch from the CPU wheels: unrestricted, `ubuntu-latest` pulls ~15 `nvidia-*-cu12`
# wheels and ~2.5 GB per run into a 10 GB cache (ADR-0023). `explicit` keeps everything else on
# PyPI. uv-only by construction — a Linux `pip install 'sdw[asr]'` gets CUDA torch, which is
# supported but untested, and is a documented caveat rather than a defect.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py313"
# Vendored verbatim; see `src/sdw/score/_vendor/README.md` for why it is out of every tool here.
extend-exclude = ["src/sdw/score/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# `examples` is a repo-root tree, not a package under `src`, so isort cannot infer it (ADR-0009).
known-first-party = ["sdw", "tests", "examples"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "examples"]
# `exclude` keeps the vendored tree off the file list; the `follow_imports` override below stops
# importing it from checked code dragging it back in.
exclude = ["^src/sdw/score/_vendor/"]

# `torch` is deliberately absent: it ships `py.typed`, so an override would turn every torch call
# into `Any` and degrade `--strict` from strong to vacuous without ever going red (ADR-0023). That
# is why `mypy` runs in the `asr` job and cannot run in a torch-free venv at all.
[[tool.mypy.overrides]]
module = ["soundfile.*", "soxr.*", "scipy.*", "matplotlib.*", "transformers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sdw.score._vendor.*"]
follow_imports = "skip"
ignore_errors = true

[tool.coverage.run]
# Uncovered branches in the vendored tree are upstream's shape, not a gap in our tests.
omit = ["src/sdw/score/_vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sdw --cov-report=term-missing"
